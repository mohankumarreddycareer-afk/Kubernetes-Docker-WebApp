apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kubernetes-webapp
  template:
    metadata:
      labels:
        app: kubernetes-webapp
    spec:
      containers:
        - name: webapp
          image: kubernetes-webapp:v1
          ports:
            - containerPort: 80